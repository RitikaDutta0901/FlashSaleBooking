spring.application.name=flashsale

# PostgreSQL connection
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/flashsale}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Database migrations (Flyway)
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Security (HTTP Basic)
app.security.username=${APP_USERNAME:admin}
app.security.password=${APP_PASSWORD:admin123}

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2s
spring.data.redis.repositories.enabled=false

# Rate limiting (per client IP, per minute)
app.rate-limit.backend=${RATE_LIMIT_BACKEND:redis}
app.rate-limit.requests-per-minute=${RATE_LIMIT_PER_MINUTE:60}

# Server
server.port=8080
